{{block "contact" .}}<h2>Ping: Contact-me</h2>
<p>[Use (C-c) to return. Tab between fields, Enter to send.]</p>
<section class=contact>
  <p class=muted>mail : <a href=mailto:dev.sahilsinha@gmail.com target=_blank>dev.sahilsinha@gmail.com</a><br>
  linkedin : <a href=https://www.linkedin.com/in/sayhilel/ target=_blank>linkedin/sayhilel</a></p>
  <form class=contact-form hx-post=/contact hx-target=#contact-result hx-swap=innerHTML hx-disabled-elt="find button">
    <label><span>name ❯</span><input name=name maxlength=100 required autocomplete=name autofocus></label>
    <label><span>email ❯</span><input name=email type=email maxlength=254 required autocomplete=email></label>
    <label><span>message ❯</span><textarea name=message maxlength=2000 rows=5 required></textarea></label>
    <label class=hp aria-hidden=true>website <input name=website tabindex=-1 autocomplete=off></label>
    <button type=submit>[ send ]</button>
  </form>
  <div id=contact-result></div>
</section>
{{end}}
